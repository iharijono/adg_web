name: Build and Sync

# Builds the static export and uploads it as a workflow artifact. This is
# the artifact the `ai-decision-governance` demo-up workflow will eventually
# pull down and serve via nginx alongside the demo stack (not yet wired —
# deployment integration is tracked separately; see adg_web/README.md).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout adg_web
        uses: actions/checkout@v4
        with:
          path: adg_web

      - name: Checkout adg_prod
        uses: actions/checkout@v4
        with:
          repository: iharijono/adg_prod
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: adg_prod

      - name: Checkout ai-decision-governance
        uses: actions/checkout@v4
        with:
          repository: iharijono/adg
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: ai-decision-governance

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: adg_web/package-lock.json

      - name: Install dependencies
        working-directory: adg_web
        run: npm ci

      - name: Build static export
        working-directory: adg_web
        run: npm run build

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: adg-web-static-site
          path: adg_web/out/
          retention-days: 14
