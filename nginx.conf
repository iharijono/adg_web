# nginx config for serving the Next.js static export (output: "export").
# Next writes both "<route>.html" and a "<route>/" directory (RSC
# payload .txt files, harmless to also serve) per route -- this config
# resolves a request for "/products/governance" to
# "/products/governance.html" before falling back to the directory
# index, and serves the generated 404.html for anything unmatched.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
